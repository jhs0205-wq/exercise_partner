<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강철 오운완 시스템 v7.9</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #4caf50;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --danger-color: #e57373;
            --edit-color: #64b5f6;
            --info-color: #ff9800;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 20px;
        }

        /* ⏱️ 상단 고정 통합 계기판 */
        .status-board {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
            position: sticky;
            top: 10px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 2px 0;
            font-variant-numeric: tabular-nums;
        }

        .live-counter {
            background: #151515;
            padding: 6px;
            border-radius: 6px;
            margin-top: 5px;
            font-size: 13px;
            font-weight: bold;
            color: var(--info-color);
            border: 1px solid #333;
            line-height: 1.4;
        }

        /* 👤 신체 스펙 입력 영역 */
        .profile-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #333;
            text-align: center;
        }
        .profile-inputs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 8px;
        }
        .profile-input-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .profile-input {
            width: 75px;
            padding: 6px;
            background: #121212;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
        }

        /* 🗂️ 루틴 탭 관리 */
        .routine-management {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 15px;
            background: #1a1a1a;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #2d2d2d;
        }

        .routine-tabs {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .routine-tabs::-webkit-scrollbar { height: 4px; }
        .routine-tabs::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

        .tab-btn {
            background-color: #252525;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
        }

        .tab-btn.active { background-color: var(--accent-color); }

        .tab-controls { display: flex; gap: 5px; }
        .control-btn { flex: 1; padding: 6px; font-size: 11px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-add-tab { background-color: #2e7d32; }
        .btn-del-tab { background-color: #c62828; }

        /* 🏋️‍♂️ 운동 제어 카드 */
        .workout-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            border: 1px solid #333;
        }

        .workout-main-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .workout-title { font-size: 18px; font-weight: bold; color: #fff; }
        .workout-meta-summary { font-size: 12px; color: var(--text-muted); margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
        
        .header-btn-group {
            display: flex;
            gap: 5px;
        }

        .main-start-trigger { background: #1b5e20; color: #fff; border: 1px solid #2e7d32; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .main-start-trigger.active { background: #b71c1c; border-color: #c62828; }
        .main-edit-trigger { background: #333; color: var(--edit-color); border: 1px solid #444; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }

        /* 🟢 시각적 세트 게이지 */
        .set-visual-dots { display: flex; gap: 4px; margin-top: 6px; }
        .set-dot { width: 14px; height: 14px; border-radius: 50%; background-color: #333; border: 1px solid #555; display: inline-block; }
        .set-dot.done { background-color: var(--accent-color); border-color: #66bb6a; box-shadow: 0 0 6px var(--accent-color); }

        /* 🛠️ 수정 제어판 */
        .workout-expanded-panel { display: none; margin-top: 10px; background: #181818; border-radius: 6px; padding: 8px; border: 1px dashed #444; }
        .panel-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
        .panel-row:last-child { margin-bottom: 0; }
        .move-controls { display: flex; gap: 4px; }
        .panel-btn { background: #333; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .panel-btn-del { background-color: var(--danger-color); color: white; font-weight: bold; }
        .panel-rest-input { width: 45px; background: #121212; border: 1px solid #555; color: var(--accent-color); text-align: center; border-radius: 4px; font-weight: bold; padding: 2px; font-size: 12px; }

        /* 🔢 입력 조절 UI */
        .input-group { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; margin-bottom: 10px; }
        .control-label { width: 45px; font-weight: bold; color: var(--text-muted); font-size: 14px; }
        .counter-btn { background-color: #2d2d2d; color: white; border: 1px solid #444; width: 44px; height: 44px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .value-display { font-size: 20px; font-weight: bold; width: 90px; text-align: center; color: #fff; }
        .bodyweight-display { font-size: 16px; font-weight: bold; width: 180px; text-align: center; color: var(--accent-color); background: #151515; padding: 10px 0; border-radius: 8px; border: 1px solid #252525; }

        .log-btn { width: 100%; background-color: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.3); margin-top: 5px; }

        /* ➕ 운동 추가 카드 */
        .add-workout-card { background-color: #252525; border-radius: 12px; padding: 12px; margin-bottom: 15px; border: 1px dashed var(--accent-color); }
        .add-input { width: 100%; padding: 8px; margin-bottom: 8px; background: #121212; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        .checkbox-group { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 13px; color: var(--text-muted); }
        .add-btn { width: 100%; background-color: var(--accent-color); color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }

        /* 📅 하단 보드 스타일 */
        .calendar-card { background-color: var(--card-bg); border-radius: 12px; padding: 12px; margin-top: 25px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; font-size: 14px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .calendar-day-label { font-size: 11px; color: var(--text-muted); font-weight: bold; padding-bottom: 3px; }
        .calendar-day { background: #252525; padding: 6px 0; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid transparent; position: relative; }
        .calendar-day.selected { border: 1px solid var(--accent-color); background: #1b3a1b; }
        .calendar-day.has-log::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background-color: var(--accent-color); border-radius: 50%; }

        /* 📈 성장 통계 대시보드 */
        .stats-card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        .chart-container { display: flex; justify-content: space-between; align-items: flex-end; height: 120px; padding-top: 20px; border-bottom: 1px solid #444; margin-bottom: 8px; }
        .chart-bar-wrapper { display: flex; flex-direction: column; align-items: center; flex: 1; gap: 4px; }
        .chart-bar { width: 22px; background-color: var(--accent-color); border-radius: 4px 4px 0 0; position: relative; transition: height 0.3s ease; }
        .chart-bar-val { font-size: 9px; color: #fff; position: absolute; top: -16px; width: 100%; text-align: center; font-weight: bold; }
        .chart-label { font-size: 10px; color: var(--text-muted); text-align: center; }

        .history-section { background-color: #1a1a1a; border-radius: 12px; padding: 12px; margin-bottom: 30px; border: 1px solid #333; }
        .history-header-box { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 6px; margin-bottom: 10px; }
        .history-btn-zone { display: flex; gap: 6px; }
        .btn-copy-gemini { background-color: #1565c0; color: white; border: none; padding: 5px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-clear-all { background-color: #b71c1c; color: white; border: none; padding: 5px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .log-entry { display: flex; flex-direction: column; padding: 8px; border-bottom: 1px solid #252525; font-size: 13px; border-radius: 6px; margin-bottom: 6px; background: #222; gap: 4px; }
        .set-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px; border-top: 1px solid #2d2d2d; }
        .inline-btn { padding: 2px 6px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; margin-left: 4px; color: white; }
        .btn-edit { background-color: var(--edit-color); }
        .btn-del { background-color: var(--danger-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ 강철 오운완 시스템 v7.9</h1>
        <p style="color: var(--text-muted); margin: 3px 0 0 0; font-size: 12px;">주간 총 볼륨 추적 및 대시보드 탑재 버전</p>
    </header>

    <div class="status-board">
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div style="color: var(--accent-color); font-size: 12px; font-weight: bold; margin-bottom: 3px;" id="timerStatus">대기 중</div>
        <div class="live-counter" id="liveCounterBox">현재 진행 중인 세트가 없습니다.</div>
    </div>

    <div class="profile-card">
        <div style="font-weight: bold; color: var(--accent-color); font-size: 13px;">🏃 개인 스펙 연동</div>
        <div class="profile-inputs">
            <div class="profile-input-wrapper">
                <input type="number" id="userHeight" class="profile-input" placeholder="키" onchange="saveProfileSpec()"> cm
            </div>
            <div class="profile-input-wrapper">
                <input type="number" id="userWeight" class="profile-input" placeholder="몸무게" onchange="saveProfileSpec()"> kg
            </div>
        </div>
    </div>

    <div class="routine-management" id="routineMetaBox">
        <div class="routine-tabs" id="routineTabsContainer"></div>
        <div class="tab-controls">
            <button class="control-btn btn-add-tab" onclick="addCustomRoutine()">➕ 새 루틴 추가</button>
            <button class="control-btn btn-del-tab" onclick="deleteCurrentRoutine()">🗑️ 현재 루틴 삭제</button>
        </div>
    </div>

    <div id="workoutContainer"></div>

    <div class="add-workout-card" id="addWorkoutBox">
        <div style="font-weight: bold; margin-bottom: 8px; color: var(--accent-color); font-size: 13px;" id="addTitle">현재 탭에 운동 추가</div>
        <input type="text" id="newWorkoutName" class="add-input" placeholder="예: 벤치프레스, 턱걸이, 크런치">
        <input type="number" id="newWorkoutRest" class="add-input" placeholder="휴식 시간 (초 단위, 예: 60, 120)" value="60">
        <div class="checkbox-group">
            <input type="checkbox" id="isBodyweight">
            <label for="isBodyweight">⚠️ 무게 없는 맨몸 운동 (턱걸이, 크런치 등)</label>
        </div>
        <button class="add-btn" onclick="addNewWorkout()">선택된 루틴에 추가</button>
    </div>

    <div class="calendar-card" id="calendarBox">
        <div class="calendar-header">
            <span id="calendarMonthYear"></span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="stats-card">
        <div style="font-weight: bold; color: var(--accent-color); font-size: 13px; margin-bottom: 5px;">📊 최근 7일간 총 훈련 볼륨 추세 (kg)</div>
        <div class="chart-container" id="volumeChartContainer"></div>
    </div>

    <div class="history-section" id="historyBox">
        <div class="history-header-box">
            <div style="font-weight: bold; color: var(--accent-color); font-size: 14px;" id="historyTitle">오늘의 기록</div>
            <div class="history-btn-zone">
                <button class="btn-copy-gemini" onclick="copyTodayLogForGemini()">📋 Gemini 복사</button>
                <button class="btn-clear-all" onclick="clearAllTodayLogs()">🧹 전체 삭제</button>
            </div>
        </div>
        <div id="historyContent" style="color: var(--text-muted); font-size: 13px;">선택한 날짜에 기록된 운동이 없습니다.</div>
    </div>
</div>

<script>
    let timerInterval = null;
    let timerTimeLeft = 0;
    
    let database = JSON.parse(localStorage.getItem('workout_db')) || {};
    
    const defaultRoutine = {
        "1.가슴_어깨": [
            { id: 'p1', name: '벤치프레스', weight: 60, reps: 7, rest: 180, weightUnit: 5, isBodyweight: false, dist: 0.4 },
            { id: 'p2', name: '인클 덤벨프레스', weight: 15, reps: 15, rest: 120, weightUnit: 1, isBodyweight: false, dist: 0.4 },
            { id: 'p3', name: 'ohp', weight: 40, reps: 6, rest: 120, weightUnit: 5, isBodyweight: false, dist: 0.45 },
            { id: 'p4', name: '사레레', weight: 4, reps: 20, rest: 60, weightUnit: 1, isBodyweight: false, dist: 0.35 },
            { id: 'p5', name: '인클 펙덱', weight: 8, reps: 15, rest: 60, weightUnit: 1, isBodyweight: false, dist: 0.35 }
        ],
        "2.등": [
            { id: 'l1', name: '데드', weight: 120, reps: 5, rest: 240, weightUnit: 5, isBodyweight: false, dist: 0.55 },
            { id: 'l2', name: '바벨로우', weight: 50, reps: 8, rest: 120, weightUnit: 5, isBodyweight: false, dist: 0.5 },
            { id: 'l3', name: '턱걸이', weight: 0, reps: 5, rest: 120, weightUnit: 1, isBodyweight: true, dist: 0.6 }
        ],
        "3.하체": [
            { id: 'g1', name: '스쿼트', weight: 90, reps: 5, rest: 240, weightUnit: 5, isBodyweight: false, dist: 0.55 },
            { id: 'g2', name: '런지', weight: 0, reps: 12, rest: 90, weightUnit: 1, isBodyweight: false, dist: 0.45 },
            { id: 'g3', name: '레그레이즈', weight: 0, reps: 15, rest: 60, weightUnit: 1, isBodyweight: true, dist: 0.4 }
        ]
    };
    
    let routineData = JSON.parse(localStorage.getItem('routine_db_v79_final')) || defaultRoutine;
    let currentRoutine = Object.keys(routineData)[0] || "1.가슴_어깨";

    let activeSingleWorkoutId = null;

    const todayStr = getFormattedDate(new Date());
    let selectedDateStr = todayStr;

    loadProfileSpec();
    initCalendar();
    renderTabs();
    renderWorkouts();
    showHistoryAt(todayStr);
    renderVolumeChart();

    function getFormattedDate(date) {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function loadProfileSpec() {
        const spec = JSON.parse(localStorage.getItem('user_spec')) || { height: 175, weight: 75 };
        document.getElementById('userHeight').value = spec.height;
        document.getElementById('userWeight').value = spec.weight;
    }

    function saveProfileSpec() {
        const h = parseFloat(document.getElementById('userHeight').value) || 175;
        const w = parseFloat(document.getElementById('userWeight').value) || 75;
        localStorage.setItem('user_spec', JSON.stringify({ height: h, weight: w }));
        renderWorkouts();
        showHistoryAt(selectedDateStr);
        renderVolumeChart();
    }

    function calculateAdvancedKcal(isBodyweight, targetWeight, dist, reps) {
        const spec = JSON.parse(localStorage.getItem('user_spec')) || { weight: 75 };
        const activeMass = isBodyweight ? spec.weight : targetWeight;
        const targetDist = dist || 0.45;
        const joule = activeMass * 9.8 * targetDist * reps;
        const basePhysicalKcal = joule / 4184;
        const finalKcal = basePhysicalKcal * 4.2 * 1.5;
        return parseFloat(finalKcal.toFixed(1));
    }

    function toggleSingleWorkoutMode(id) {
        const metaBox = document.getElementById('routineMetaBox');
        const addBox = document.getElementById('addWorkoutBox');
        const calendarBox = document.getElementById('calendarBox');
        const historyBox = document.getElementById('historyBox');

        if(activeSingleWorkoutId === id) {
            activeSingleWorkoutId = null;
            metaBox.style.display = 'flex';
            addBox.style.display = 'block';
            calendarBox.style.display = 'block';
            historyBox.style.display = 'block';
        } else {
            activeSingleWorkoutId = id;
            metaBox.style.display = 'none';
            addBox.style.display = 'none';
            calendarBox.style.display = 'none';
            historyBox.style.display = 'none';
        }
        renderWorkouts();
    }

    function renderTabs() {
        const container = document.getElementById('routineTabsContainer');
        container.innerHTML = '';
        const keys = Object.keys(routineData);
        keys.forEach(key => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${key === currentRoutine ? 'active' : ''}`;
            btn.innerText = key;
            btn.onclick = () => {
                currentRoutine = key;
                renderTabs();
                renderWorkouts();
            };
            container.appendChild(btn);
        });
        document.getElementById('addTitle').innerText = `＋ [${currentRoutine}] 루틴에 운동 추가`;
    }

    function addCustomRoutine() {
        const newName = prompt("새 루틴 이름을 입력하십시오.");
        if(!newName || !newName.trim()) return;
        const cleanName = newName.trim();
        if(routineData[cleanName]) return alert("이미 존재합니다.");
        routineData[cleanName] = [];
        currentRoutine = cleanName;
        saveRoutineDB();
        renderTabs();
        renderWorkouts();
    }

    function deleteCurrentRoutine() {
        if(!confirm(`[${currentRoutine}] 루틴을 삭제하시겠습니까?`)) return;
        delete routineData[currentRoutine];
        currentRoutine = Object.keys(routineData)[0] || "";
        saveRoutineDB();
        renderTabs();
        renderWorkouts();
    }

    function saveRoutineDB() { localStorage.setItem('routine_db_v79_final', JSON.stringify(routineData)); }

    function addNewWorkout() {
        const nameInput = document.getElementById('newWorkoutName');
        const restInput = document.getElementById('newWorkoutRest');
        const isBodyweightCheck = document.getElementById('isBodyweight');
        if (!nameInput.value.trim()) return alert('운동명을 입력하십시오!');

        const name = nameInput.value.trim();
        const isHeavy = name.includes('벤치') || name.includes('스쿼트') || name.includes('데드') || name.includes('로우') || name.includes('프레스') || name.includes('ohp');
        const newId = 'custom_' + Date.now();
        
        routineData[currentRoutine].push({
            id: newId, name: name,
            weight: isBodyweightCheck.checked ? 0 : (isHeavy ? 40 : 10),
            reps: 10, rest: parseInt(restInput.value) || 60,
            weightUnit: isHeavy ? 5 : 1, isBodyweight: isBodyweightCheck.checked,
            dist: isHeavy ? 0.5 : 0.4
        });
        saveRoutineDB();
        nameInput.value = '';
        isBodyweightCheck.checked = false;
        renderWorkouts();
    }

    function renderWorkouts() {
        const container = document.getElementById('workoutContainer');
        container.innerHTML = '';
        let fullList = routineData[currentRoutine] || [];

        if(activeSingleWorkoutId !== null) {
            fullList = fullList.filter(w => w.id === activeSingleWorkoutId);
        }

        const spec = JSON.parse(localStorage.getItem('user_spec')) || { weight: 75 };

        fullList.forEach((w) => {
            const card = document.createElement('div');
            card.className = 'workout-card';

            let completedSets = 0;
            let currentVolume = 0;
            if(database[todayStr]) {
                const logged = database[todayStr].filter(log => log.name === w.name);
                logged.forEach(l => {
                    completedSets += l.sets.length;
                    l.sets.forEach(s => {
                        const activeMass = w.isBodyweight ? spec.weight : (parseFloat(l.weightDisplay) || 0);
                        currentVolume += (activeMass * s.reps);
                    });
                });
            }

            let totalDotsCount = Math.max(5, completedSets);
            let dotsHtml = '';
            for (let i = 0; i < totalDotsCount; i++) {
                dotsHtml += `<span class="set-dot ${i < completedSets ? 'done' : ''}"></span>`;
            }

            const estimatedKcal = calculateAdvancedKcal(w.isBodyweight, w.weight, w.dist, w.reps);

            let weightSection = w.isBodyweight ? 
                `<div class="input-group"><div class="control-label">무게</div><div class="bodyweight-display">💪 맨몸 운동</div></div>` :
                `<div class="input-group">
                    <div class="control-label">무게</div>
                    <button class="counter-btn" onclick="adjustValue('${w.id}', 'weight', -${w.weightUnit})">-${w.weightUnit}</button>
                    <div class="value-display" id="${w.id}-weight">${w.weight} kg</div>
                    <button class="counter-btn" onclick="adjustValue('${w.id}', 'weight', ${w.weightUnit})">+${w.weightUnit}</button>
                </div>`;

            const isCurrentActive = activeSingleWorkoutId === w.id;
            const startBtnText = isCurrentActive ? "⏹️ 종목 종료" : "▶️ 운동 시작";
            const startBtnClass = isCurrentActive ? "main-start-trigger active" : "main-start-trigger";

            card.innerHTML = `
                <div class="workout-main-info">
                    <div>
                        <div class="workout-title">${w.name}</div>
                        <div class="workout-meta-summary">
                            <span>⏱️ 휴식: ${w.rest}초 | 🔥 세트당 ${estimatedKcal} kcal</span>
                            <span style="color:#64b5f6; font-weight:bold; margin-top:2px;">📊 현재 누적 볼륨: ${currentVolume} kg</span>
                        </div>
                        <div class="set-visual-dots">${dotsHtml}</div>
                    </div>
                    <div class="header-btn-group">
                        <button class="${startBtnClass}" onclick="toggleSingleWorkoutMode('${w.id}')">${startBtnText}</button>
                        ${!isCurrentActive ? `<button class="main-edit-trigger" onclick="toggleEditPanel('${w.id}')">⚙️</button>` : ''}
                    </div>
                </div>

                <div class="workout-expanded-panel" id="panel-${w.id}">
                    <div class="panel-row"><span>순서 변경</span><div class="move-controls"><button class="panel-btn" onclick="moveWorkout('${w.id}', -1)">▲ 위로</button><button class="panel-btn" onclick="moveWorkout('${w.id}', 1)">▼ 아래로</button></div></div>
                    <div class="panel-row"><span>휴식시간 편집</span><div><input type="number" class="panel-rest-input" value="${w.rest}" onchange="updateRestTime('${w.id}', this.value)"> 초</div></div>
                    <div class="panel-row" style="justify-content: flex-end;"><button class="panel-btn panel-btn-del" onclick="deleteWorkout('${w.id}')">🗑️ 제거</button></div>
                </div>
                
                ${weightSection}

                <div class="input-group">
                    <div class="control-label">횟수</div>
                    <button class="counter-btn" onclick="adjustValue('${w.id}', 'reps', -1)">-1</button>
                    <div class="value-display" id="${w.id}-reps">${w.reps} 회</div>
                    <button class="counter-btn" onclick="adjustValue('${w.id}', 'reps', 1)">+1</button>
                </div>

                <button class="log-btn" onclick="logSet('${w.id}', '${w.name}')">${isCurrentActive ? "✔️ 이번 세트 완료" : "세트 완료"}</button>
            `;
            container.appendChild(card);
        });
    }

    function toggleEditPanel(id) { const panel = document.getElementById(`panel-${id}`); panel.style.display = panel.style.display === 'block' ? 'none' : 'block'; }
    function updateRestTime(id, newSeconds) { const item = routineData[currentRoutine].find(w => w.id === id); if(item) item.rest = parseInt(newSeconds) || 0; saveRoutineDB(); renderWorkouts(); }
    function moveWorkout(id, direction) { const list = routineData[currentRoutine]; const idx = list.findIndex(w => w.id === id); if (idx === -1) return; const newIdx = idx + direction; if (newIdx < 0 || newIdx >= list.length) return; const temp = list[idx]; list[idx] = list[newIdx]; list[newIdx] = temp; saveRoutineDB(); renderWorkouts(); document.getElementById(`panel-${id}`).style.display = 'block'; }
    function deleteWorkout(id) { if(!confirm("제외하겠습니까?")) return; routineData[currentRoutine] = routineData[currentRoutine].filter(w => w.id !== id); saveRoutineDB(); renderWorkouts(); }
    function adjustValue(id, key, amount) { const item = routineData[currentRoutine].find(w => w.id === id); if(item) { item[key] += amount; if(item[key] < 0) item[key] = 0; const el = document.getElementById(`${id}-${key}`); if(el) el.innerText = item[key] + (key === 'weight' ? ' kg' : ' 회'); saveRoutineDB(); if(key==='weight' || key==='reps') renderWorkouts(); } }

    function logSet(id, name) {
        if (selectedDateStr !== todayStr) return alert("🔒 운동 기록은 당일만 가능합니다!");
        const item = routineData[currentRoutine].find(w => w.id === id);
        if (!database[todayStr]) database[todayStr] = [];

        const spec = JSON.parse(localStorage.getItem('user_spec')) || { weight: 75 };
        const calculatedBurn = calculateKcalForLog(name, item.isBodyweight, item.weight, item.reps);

        const weightText = item.isBodyweight ? '맨몸' : `${item.weight}kg`;
        const timeText = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        const existingGroup = database[todayStr].find(log => log.name === name && log.weightDisplay === weightText);
        let totalSetsNum = 1;

        if (existingGroup) {
            totalSetsNum = existingGroup.sets.length + 1;
            existingGroup.sets.push({ setNum: totalSetsNum, reps: item.reps, time: timeText, kcal: calculatedBurn });
        } else {
            database[todayStr].push({ name: name, weightDisplay: weightText, sets: [{ setNum: 1, reps: item.reps, time: timeText, kcal: calculatedBurn }] });
        }

        localStorage.setItem('workout_db', JSON.stringify(database));
        updateTopDashboard();

        initCalendar();
        renderWorkouts();
        showHistoryAt(todayStr);
        renderVolumeChart();
        startTimer(item.rest);
    }

    function calculateKcalForLog(workoutName, isBodyweight, targetWeight, reps) {
        const flatList = [].concat(...Object.values(routineData));
        const match = flatList.find(x => x.name === workoutName) || { dist: 0.45 };
        return calculateAdvancedKcal(isBodyweight, targetWeight, match.dist, reps);
    }

    function updateTopDashboard() {
        let todayTotalKcal = 0;
        let todayTotalVolume = 0;
        const spec = JSON.parse(localStorage.getItem('user_spec')) || { weight: 75 };

        if(database[todayStr]) {
            database[todayStr].forEach(log => {
                const isBodyweight = (log.weightDisplay === '맨몸');
                const rawWeight = isBodyweight ? spec.weight : (parseFloat(log.weightDisplay) || 0);
                log.sets.forEach(s => {
                    todayTotalKcal += (s.kcal || 0);
                    todayTotalVolume += (rawWeight * s.reps);
                });
            });
        }
        document.getElementById('liveCounterBox').innerHTML = `
            📊 <span style="color:#64b5f6; font-weight:bold;">오늘 총 리프팅 볼륨: ${todayTotalKcal > 0 ? todayTotalVolume : 0} kg</span><br>
            🔥 <span style="color:var(--danger-color); font-weight:bold;">오늘의 총 대사 소모량 (EPOC 포함): ${todayTotalKcal.toFixed(1)} kcal</span>
        `;
    }

    // 📈 주간 볼륨 통계 바형 그래프 렌더링 스크립트 엔진
    function renderVolumeChart() {
        const chartContainer = document.getElementById('volumeChartContainer');
        chartContainer.innerHTML = '';
        
        const spec = JSON.parse(localStorage.getItem('user_spec')) || { weight: 75 };
        const dayVolumes = [];
        const dayLabels = [];

        // 최근 7일치 날짜 데이터 역산 추출
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dStr = getFormattedDate(d);
            dayLabels.push(`${d.getMonth()+1}/${d.getDate()}`);
            
            let volSum = 0;
            if (database[dStr]) {
                database[dStr].forEach(log => {
                    const isBW = (log.weightDisplay === '맨몸');
                    const w = isBW ? spec.weight : (parseFloat(log.weightDisplay) || 0);
                    log.sets.forEach(s => volSum += (w * s.reps));
                });
            }
            dayVolumes.push(volSum);
        }

        const maxVol = Math.max(...dayVolumes, 500); // 그래프 상한선 조절 베이스 라인 500kg

        for (let i = 0; i < 7; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'chart-bar-wrapper';

            const bar = document.createElement('div');
            bar.className = 'chart-bar';
            
            // 높이 비율 동적 환산 반영
            const heightPercent = (dayVolumes[i] / maxVol) * 100;
            bar.style.height = `${Math.max(heightPercent, 2)}%`; 

            if (dayVolumes[i] > 0) {
                bar.innerHTML = `<div class="chart-bar-val">${dayVolumes[i]}</div>`;
            }

            const label = document.createElement('div');
            label.className = 'chart-label';
            label.innerText = dayLabels[i];

            wrapper.appendChild(bar);
            wrapper.appendChild(label);
            chartContainer.appendChild(wrapper);
        }
    }

    // 📋 훈련 완수 후 기록 문자열 자동 클립보드 패키징 함수
    function copyTodayLogForGemini() {
        if (!database[selectedDateStr] || database[selectedDateStr].length === 0) {
            return alert("복사할 기록이 없습니다. 먼저 쇠질을 하십시오!");
        }

        const spec = JSON.parse(localStorage.getItem('user_spec')) || { weight: 75 };
        let textResult = `[강철 오운완 리포트 - ${selectedDateStr}]\n`;
        textResult += `👤 신체 스펙 정보: 몸무게 ${spec.weight}kg\n`;
        textResult += `------------------------------------\n`;

        let dayKcal = 0;
        let dayVol = 0;

        database[selectedDateStr].forEach(log => {
            textResult += `🏋️‍♂️ 운동 종목: ${log.name} [${log.weightDisplay}]\n`;
            const isBW = (log.weightDisplay === '맨몸');
            const w = isBW ? spec.weight : (parseFloat(log.weightDisplay) || 0);

            log.sets.forEach(s => {
                const sKcal = s.kcal || 0;
                const sVol = w * s.reps;
                dayKcal += sKcal;
                dayVol += sVol;
                textResult += `  └ ${s.setNum}세트: ${s.reps}회 (${sKcal}kcal) [볼륨: ${sVol}kg]\n`;
            });
        });

        textResult += `------------------------------------\n`;
        textResult += `📊 오늘 하루 총 리프팅 중량 볼륨: ${dayVol} kg\n`;
        textResult += `🔥 오늘 하루 총 누적 대사 소모량 (EPOC 포함): ${dayKcal.toFixed(1)} kcal\n`;
        textResult += `\nGemini형님! 오늘의 오운완 스펙 피드백과 칼로리 분석 부탁드립니다! 💪`;

        navigator.clipboard.writeText(textResult).then(() => {
            alert("📋 오늘의 오운완 리포트 데이터가 클립보드에 복사되었습니다!\nGemini 대화창에 바로 붙여넣기(Ctrl+V) 하십시오!");
        }).catch(() => {
            alert("복사에 실패했습니다. 브라우저 권한을 확인해 주십시오.");
        });
    }

    function clearAllTodayLogs() {
        if(!database[selectedDateStr] || database[selectedDateStr].length === 0) return alert("삭제할 기록이 없습니다.");
        if(!confirm(`⚠️ 경고: [${selectedDateStr}]의 모든 기록과 대사 데이터가 영구 삭제됩니다.`)) return;
        
        delete database[selectedDateStr];
        localStorage.setItem('workout_db', JSON.stringify(database));
        
        initCalendar();
        renderWorkouts();
        showHistoryAt(selectedDateStr);
        renderVolumeChart();
        document.getElementById('liveCounterBox').innerText = "현재 진행 중인 세트가 없습니다.";
    }

    function showHistoryAt(dateStr) {
        document.getElementById('historyTitle').innerText = `${dateStr}의 전체 기록 피드`;
        const content = document.getElementById('historyContent');
        content.innerHTML = '';
        if (!database[dateStr] || database[dateStr].length === 0) return content.innerText = '기록된 운동이 없습니다.';

        let dayTotalKcal = 0;
        let dayTotalVol = 0;
        const spec = JSON.parse(localStorage.getItem('user_spec')) || { weight: 75 };

        database[dateStr].forEach((log, groupIdx) => {
            const row = document.createElement('div');
            row.className = 'log-entry';
            let setRowsHtml = '';
            const isBW = (log.weightDisplay === '맨몸');
            const w = isBW ? spec.weight : (parseFloat(log.weightDisplay) || 0);

            log.sets.forEach((s, sIdx) => {
                const setKcal = s.kcal || 0;
                dayTotalKcal += setKcal;
                dayTotalVol += (w * s.reps);
                setRowsHtml += `
                    <div class="set-row">
                        <span style="color:var(--text-muted); font-size:12px;">
                            └ ${s.setNum}세트: ${s.reps}회 
                            <small style="color:var(--danger-color); font-weight:bold; margin-left:5px;">[${setKcal} kcal]</small>
                            <small style="color:#64b5f6; font-weight:bold; margin-left:5px;">[${w * s.reps} kg]</small>
                        </span>
                        <div>
                            <button class="inline-btn btn-edit" onclick="editSpecificSet('${dateStr}', ${groupIdx}, ${sIdx})">✏️</button>
                            <button class="inline-btn btn-del" onclick="deleteSpecificSet('${dateStr}', ${groupIdx}, ${sIdx})">🗑️</button>
                        </div>
                    </div>`;
            });
            row.innerHTML = `<div style="display:flex; justify-content:space-between; font-weight:bold; padding:6px; background:#2a2a2a; border-radius:4px 4px 0 0; font-size:13px;"><span>${log.name}</span><span style="color:#ff9800;">[${log.weightDisplay}]</span></div><div style="padding: 6px;">${setRowsHtml}</div>`;
            content.appendChild(row);
        });

        const totalBox = document.createElement('div');
        totalBox.style.cssText = "padding:10px; margin-top:10px; border-top:1px solid #444; line-height:1.5; font-weight:bold; text-align:right; font-size:13px;";
        totalBox.innerHTML = `
            <span style="color:#64b5f6;">📊 이 날의 총 훈련 볼륨: ${dayTotalVol} kg</span><br>
            <span style="color:var(--danger-color);">🔥 이 날의 총 누적 대사량: ${dayTotalKcal.toFixed(1)} kcal</span>
        `;
        content.appendChild(totalBox);
    }

    function editSpecificSet(dateStr, groupIdx, sIdx) {
        const log = database[dateStr][groupIdx];
        const targetSet = log.sets[sIdx];
        const newReps = prompt(`[${log.name}] ${targetSet.setNum}세트의 수정할 횟수 입력`, targetSet.reps);
        if (newReps !== null && !isNaN(newReps) && newReps.trim() !== "") { 
            targetSet.reps = parseInt(newReps); 
            const spec = JSON.parse(localStorage.getItem('user_spec')) || { weight: 75 };
            const fullList = [].concat(...Object.values(routineData));
            const matched = fullList.find(w => w.name === log.name) || { dist: 0.45, isBodyweight: false };
            
            targetSet.kcal = calculateAdvancedKcal(matched.isBodyweight, parseFloat(log.weightDisplay)||0, matched.dist, targetSet.reps);
            
            saveAndReloadHistory(dateStr); 
            renderVolumeChart();
            updateTopDashboard();
        }
    }

    function deleteSpecificSet(dateStr, groupIdx, sIdx) {
        if (!confirm("삭제하시겠습니까?")) return;
        const log = database[dateStr][groupIdx];
        log.sets.splice(sIdx, 1);
        if (log.sets.length === 0) database[dateStr].splice(groupIdx, 1);
        else log.sets.forEach((s, index) => { s.setNum = index + 1; });
        saveAndReloadHistory(dateStr);
        renderWorkouts();
        renderVolumeChart();
        updateTopDashboard();
    }

    function saveAndReloadHistory(dateStr) { if (database[dateStr] && database[dateStr].length === 0) delete database[dateStr]; localStorage.setItem('workout_db', JSON.stringify(database)); initCalendar(); showHistoryAt(dateStr); }

    function initCalendar() {
        const now = new Date();
        document.getElementById('calendarMonthYear').innerText = `${now.getFullYear()}년 ${now.getMonth() + 1}월`;
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        days.forEach(d => { const label = document.createElement('div'); label.className = 'calendar-day-label'; label.innerText = d; grid.appendChild(label); });
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        for(let i=0; i<startOfMonth.getDay(); i++) grid.appendChild(document.createElement('div'));
        for(let d=1; d<=endOfMonth.getDate(); d++) {
            const dayBox = document.createElement('div');
            dayBox.className = 'calendar-day'; dayBox.innerText = d;
            const targetDateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            if (database[targetDateStr] && database[targetDateStr].length > 0) dayBox.classList.add('has-log');
            if (targetDateStr === selectedDateStr) dayBox.classList.add('selected');
            dayBox.onclick = () => { document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected')); dayBox.classList.add('selected'); selectedDateStr = targetDateStr; showHistoryAt(targetDateStr); };
            grid.appendChild(dayBox);
        }
    }

    function startTimer(seconds) {
        clearInterval(timerInterval);
        timerTimeLeft = seconds;
        const display = document.getElementById('timerDisplay');
        const status = document.getElementById('timerStatus');
        status.innerText = "🔥 근육 회복 중... 강해지는 시간! 🔥"; status.style.color = "#ff9800";
        timerInterval = setInterval(() => {
            timerTimeLeft--;
            const mins = Math.floor(timerTimeLeft / 60).toString().padStart(2, '0');
            const secs = (timerTimeLeft % 60).toString().padStart(2, '0');
            display.innerText = `${mins}:${secs}`;
            if (timerTimeLeft <= 0) { clearInterval(timerInterval); display.innerText = "00:00"; status.innerText = "💪 휴식 끝! 다음 세트 폭격하십시오! 💪"; status.style.color = "#4caf50"; if (navigator.vibrate) navigator.vibrate([500, 200, 500]); }
        }, 1000);
    }
</script>
</body>
</html>
