<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강철 오운완 시스템 v6.5</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #4caf50;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --danger-color: #e57373;
            --edit-color: #64b5f6;
            --info-color: #ff9800;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 22px;
        }

        /* ⏱️ 상단 고정 통합 계기판 (타이머 + 실시간 세트 현황) */
        .status-board {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 2px 0;
            font-variant-numeric: tabular-nums;
        }

        .live-counter {
            background: #151515;
            padding: 6px;
            border-radius: 6px;
            margin-top: 5px;
            font-size: 13px;
            font-weight: bold;
            color: var(--info-color);
            border: 1px solid #333;
        }

        /* 🔄 루틴 탭 스타일 */
        .routine-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            background-color: #252525;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
        }

        /* ➕ 운동 추가 카드 */
        .add-workout-card {
            background-color: #252525;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px dashed var(--accent-color);
        }

        .add-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #121212;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .add-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 🏋️‍♂️ 운동 카드 스타일 */
        .workout-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .workout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .workout-title {
            font-size: 16px;
            font-weight: bold;
            max-width: 50%;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .move-btn {
            background: #333;
            color: white;
            border: none;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .copy-btn {
            background: #2196f3;
            color: white;
            border: none;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .rest-input-box {
            background: #333;
            padding: 2px 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 11px;
        }

        .rest-edit-input {
            width: 35px;
            background: #121212;
            border: 1px solid #555;
            color: var(--accent-color);
            text-align: center;
            border-radius: 4px;
            font-weight: bold;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        /* 🔢 입력 조절 UI */
        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .control-label {
            width: 50px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .counter-btn {
            background-color: #333;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .value-display {
            font-size: 18px;
            font-weight: bold;
            width: 80px;
            text-align: center;
        }

        .bodyweight-display {
            font-size: 18px;
            font-weight: bold;
            width: 170px;
            text-align: center;
            color: var(--accent-color);
            background: #151515;
            padding: 8px 0;
            border-radius: 8px;
        }

        .log-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 📅 달력 및 기록 섹션 (최하단 배치 완료) */
        .calendar-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-top: 30px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .calendar-day-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: bold;
            padding-bottom: 5px;
        }

        .calendar-day {
            background: #252525;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid transparent;
            position: relative;
        }

        .calendar-day.selected {
            border: 1px solid var(--accent-color);
            background: #1b3a1b;
        }

        .calendar-day.has-log::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }

        .history-section {
            background-color: #1a1a1a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 40px;
            border: 1px solid #333;
        }

        .log-entry {
            display: flex;
            flex-direction: column;
            padding: 10px;
            border-bottom: 1px solid #252525;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s;
            gap: 4px;
        }

        .log-entry:active {
            background: #1c2a3a;
        }

        .set-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ 강철 오운완 시스템 v6.5</h1>
        <p style="color: var(--text-muted); margin: 5px 0 0 0;">실시간 상단 계기판 + 하단 기록 창 개편</p>
    </header>

    <div class="status-board">
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div style="color: var(--accent-color); font-size: 12px; font-weight: bold; margin-bottom: 3px;" id="timerStatus">대기 중</div>
        <div class="live-counter" id="liveCounterBox">현재 진행 중인 세트가 없습니다.</div>
    </div>

    <div class="routine-tabs">
        <button class="tab-btn active" id="tab-push" onclick="switchRoutine('push')">1일차: PUSH</button>
        <button class="tab-btn" id="tab-pull" onclick="switchRoutine('pull')">2일차: PULL</button>
        <button class="tab-btn" id="tab-leg" onclick="switchRoutine('leg')">3일차: LEG/코어</button>
    </div>

    <div class="add-workout-card">
        <div style="font-weight: bold; margin-bottom: 10px; color: var(--accent-color);" id="addTitle">현재 탭에 운동 추가</div>
        <input type="text" id="newWorkoutName" class="add-input" placeholder="예: 벤치프레스, 턱걸이, 크런치">
        <input type="number" id="newWorkoutRest" class="add-input" placeholder="휴식 시간 (초 단위, 예: 60, 120)" value="60">
        <div class="checkbox-group">
            <input type="checkbox" id="isBodyweight">
            <label for="isBodyweight">⚠️ 무게 없는 맨몸 운동 (턱걸이, 크런치 등)</label>
        </div>
        <button class="add-btn" onclick="addNewWorkout()">선택된 루틴에 추가</button>
    </div>

    <div id="workoutContainer"></div>

    <div class="calendar-card">
        <div class="calendar-header">
            <span id="calendarMonthYear"></span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="history-section">
        <div style="font-weight: bold; color: var(--accent-color); margin-bottom: 5px;" id="historyTitle">오늘의 기록</div>
        <div style="font-size: 11px; color: var(--edit-color); margin-bottom: 10px;">💡 기록을 터치하면 수정 / 전체 삭제가 가능합니다.</div>
        <div id="historyContent" style="color: var(--text-muted); font-size: 14px;">선택한 날짜에 기록된 운동이 없습니다.</div>
    </div>
</div>

<script>
    let timerInterval = null;
    let timerTimeLeft = 0;
    let currentRoutine = 'push';
    
    let database = JSON.parse(localStorage.getItem('workout_db')) || {};
    
    const defaultRoutine = {
        push: [
            { id: 'p1', name: '2. 벤치프레스 (Bench Press)', weight: 60, reps: 7, rest: 180, weightUnit: 5, isBodyweight: false },
            { id: 'p2', name: '5. 밀리터리 프레스 (OHP)', weight: 40, reps: 6, rest: 120, weightUnit: 5, isBodyweight: false },
            { id: 'p3', name: '4. 인클라인 덤벨 프레스', weight: 15, reps: 15, rest: 120, weightUnit: 1, isBodyweight: false },
            { id: 'p4', name: '6. 사이드 레터럴 레이즈', weight: 4, reps: 20, rest: 60, weightUnit: 1, isBodyweight: false },
            { id: 'p5', name: '7. 덤벨 펙덱플라이', weight: 8, reps: 15, rest: 60, weightUnit: 1, isBodyweight: false }
        ],
        pull: [
            { id: 'l1', name: '3. 데드리프트 (Deadlift)', weight: 120, reps: 5, rest: 240, weightUnit: 5, isBodyweight: false },
            { id: 'l2', name: '8. 턱걸이 (Pull-ups)', weight: 0, reps: 5, rest: 120, weightUnit: 1, isBodyweight: true },
            { id: 'l3', name: '9. 바벨 로우', weight: 50, reps: 8, rest: 120, weightUnit: 5, isBodyweight: false }
        ],
        leg: [
            { id: 'g1', name: '1. 백 스쿼트 (Back Squat)', weight: 90, reps: 5, rest: 240, weightUnit: 5, isBodyweight: false },
            { id: 'g2', name: '12. 런지 (Lunge)', weight: 0, reps: 12, rest: 90, weightUnit: 1, isBodyweight: false },
            { id: 'g3', name: '10. 행잉 레그레이즈', weight: 0, reps: 15, rest: 60, weightUnit: 1, isBodyweight: true },
            { id: 'g4', name: '11. 크런치', weight: 0, reps: 20, rest: 60, weightUnit: 1, isBodyweight: true }
        ]
    };
    
    let routineData = JSON.parse(localStorage.getItem('routine_db')) || defaultRoutine;

    const todayStr = getFormattedDate(new Date());
    let selectedDateStr = todayStr;

    initCalendar();
    renderWorkouts();
    updateAddTitle();
    showHistoryAt(todayStr);

    function getFormattedDate(date) {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function initCalendar() {
        const now = new Date();
        document.getElementById('calendarMonthYear').innerText = `${now.getFullYear()}년 ${now.getMonth() + 1}월`;
        
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const days = ['일', '월', '화', '수', '목', '금', '토'];
        days.forEach(d => {
            const label = document.createElement('div');
            label.className = 'calendar-day-label';
            label.innerText = d;
            grid.appendChild(label);
        });

        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        
        for(let i=0; i<startOfMonth.getDay(); i++) {
            grid.appendChild(document.createElement('div'));
        }

        for(let d=1; d<=endOfMonth.getDate(); d++) {
            const dayBox = document.createElement('div');
            dayBox.className = 'calendar-day';
            dayBox.innerText = d;
            
            const targetDateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            
            if (database[targetDateStr] && database[targetDateStr].length > 0) {
                dayBox.classList.add('has-log');
            }

            if (targetDateStr === selectedDateStr) {
                dayBox.classList.add('selected');
            }

            dayBox.onclick = () => {
                document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected'));
                dayBox.classList.add('selected');
                selectedDateStr = targetDateStr;
                showHistoryAt(targetDateStr);
            };

            grid.appendChild(dayBox);
        }
    }

    function switchRoutine(routineType) {
        currentRoutine = routineType;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${routineType}`).classList.add('active');
        updateAddTitle();
        renderWorkouts();
    }

    function updateAddTitle() {
        const titles = { push: '1일차: PUSH', pull: '2일차: PULL', leg: '3일차: LEG/코어' };
        document.getElementById('addTitle').innerText = `＋ [${titles[currentRoutine]}] 루틴에 운동 추가`;
    }

    function addNewWorkout() {
        const nameInput = document.getElementById('newWorkoutName');
        const restInput = document.getElementById('newWorkoutRest');
        const isBodyweightCheck = document.getElementById('isBodyweight');
        
        if (!nameInput.value.trim()) {
            alert('운동 이름을 입력하십시오!');
            return;
        }

        const name = nameInput.value.trim();
        const isHeavy = name.includes('벤치') || name.includes('스쿼트') || name.includes('데드') || name.includes('로우') || name.includes('프레스');
        const newId = 'custom_' + Date.now();
        
        routineData[currentRoutine].push({
            id: newId,
            name: name,
            weight: isBodyweightCheck.checked ? 0 : (isHeavy ? 40 : 10),
            reps: 10,
            rest: parseInt(restInput.value) || 60,
            weightUnit: isHeavy ? 5 : 1,
            isBodyweight: isBodyweightCheck.checked
        });

        localStorage.setItem('routine_db', JSON.stringify(routineData));
        nameInput.value = '';
        isBodyweightCheck.checked = false;
        renderWorkouts();
    }

    function deleteWorkout(id) {
        if(confirm("이 운동 종목을 현재 루틴에서 완전히 빼시겠습니까?")) {
            routineData[currentRoutine] = routineData[currentRoutine].filter(w => w.id !== id);
            localStorage.setItem('routine_db', JSON.stringify(routineData));
            renderWorkouts();
        }
    }

    function moveWorkout(id, direction) {
        const index = routineData[currentRoutine].findIndex(w => w.id === id);
        if (index === -1) return;
        
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= routineData[currentRoutine].length) return;
        
        const temp = routineData[currentRoutine][index];
        routineData[currentRoutine][index] = routineData[currentRoutine][newIndex];
        routineData[currentRoutine][newIndex] = temp;
        
        localStorage.setItem('routine_db', JSON.stringify(routineData));
        renderWorkouts();
    }

    function copyWorkoutToOtherTab(id) {
        const item = routineData[currentRoutine].find(w => w.id === id);
        if (!item) return;

        const targetTab = prompt("이 종목을 복사해 보낼 탭을 입력하십시오.\n(push, pull, leg 중 입력)", currentRoutine === 'push' ? 'pull' : 'push');
        if (!targetTab || !['push', 'pull', 'leg'].includes(targetTab.toLowerCase())) {
            alert("정확한 탭 이름을 입력해 주십시오.");
            return;
        }

        const copiedItem = { ...item, id: 'copy_' + Date.now() };
        routineData[targetTab.toLowerCase()].push(copiedItem);
        
        localStorage.setItem('routine_db', JSON.stringify(routineData));
        alert(`[${targetTab.toUpperCase()}] 탭으로 복사가 완료되었습니다!`);
    }

    function renderWorkouts() {
        const container = document.getElementById('workoutContainer');
        container.innerHTML = '';

        if(routineData[currentRoutine].length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted); font-size:14px;">루틴이 비어있습니다. 위에서 운동을 추가하십시오!</div>`;
            return;
        }

        routineData[currentRoutine].forEach(w => {
            const card = document.createElement('div');
            card.className = 'workout-card';

            let weightSection = '';
            if (w.isBodyweight) {
                weightSection = `
                    <div class="input-group">
                        <div class="control-label">무게</div>
                        <div class="bodyweight-display">💪 맨몸 (자체 체중)</div>
                    </div>
                `;
            } else {
                weightSection = `
                    <div class="input-group">
                        <div class="control-label">무게</div>
                        <button class="counter-btn" onclick="adjustValue('${w.id}', 'weight', -${w.weightUnit})">-${w.weightUnit}</button>
                        <div class="value-display" id="${w.id}-weight">${w.weight} kg</div>
                        <button class="counter-btn" onclick="adjustValue('${w.id}', 'weight', ${w.weightUnit})">+${w.weightUnit}</button>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="workout-header">
                    <div class="workout-title">${w.name}</div>
                    <div class="header-controls">
                        <button class="move-btn" onclick="moveWorkout('${w.id}', -1)">▲</button>
                        <button class="move-btn" onclick="moveWorkout('${w.id}', 1)">▼</button>
                        <button class="copy-btn" onclick="copyWorkoutToOtherTab('${w.id}')">복사</button>
                        <div class="rest-input-box">
                            <input type="number" class="rest-edit-input" value="${w.rest}" onchange="updateRestTime('${w.id}', this.value)">
                            <span>초</span>
                        </div>
                        <button class="delete-btn" onclick="deleteWorkout('${w.id}')">제거</button>
                    </div>
                </div>
                
                ${weightSection}

                <div class="input-group">
                    <div class="control-label">횟수</div>
                    <button class="counter-btn" onclick="adjustValue('${w.id}', 'reps', -1)">-1</button>
                    <div class="value-display" id="${w.id}-reps">${w.reps} 회</div>
                    <button class="counter-btn" onclick="adjustValue('${w.id}', 'reps', 1)">+1</button>
                </div>

                <button class="log-btn" onclick="logSet('${w.id}', '${w.name}')">세트 완료</button>
            `;
            container.appendChild(card);
        });
    }

    function updateRestTime(id, newSeconds) {
        const item = routineData[currentRoutine].find(w => w.id === id);
        item.rest = parseInt(newSeconds) || 0;
        localStorage.setItem('routine_db', JSON.stringify(routineData));
    }

    function adjustValue(id, key, amount) {
        const item = routineData[currentRoutine].find(w => w.id === id);
        item[key] += amount;
        if(item[key] < 0) item[key] = 0;
        document.getElementById(`${id}-${key}`).innerText = item[key] + (key === 'weight' ? ' kg' : ' 회');
        localStorage.setItem('routine_db', JSON.stringify(routineData));
    }

    function logSet(id, name) {
        if (selectedDateStr !== todayStr) {
            alert("🔒 운동 기록은 당일(오늘 날짜)만 가능합니다!");
            return;
        }

        const item = routineData[currentRoutine].find(w => w.id === id);
        
        if (!database[todayStr]) {
            database[todayStr] = [];
        }

        const weightText = item.isBodyweight ? '맨몸' : `${item.weight}kg`;
        const timeText = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

        const existingGroup = database[todayStr].find(log => log.name === name && log.weightDisplay === weightText);
        let totalSetsNum = 1;

        if (existingGroup) {
            totalSetsNum = existingGroup.sets.length + 1;
            existingGroup.sets.push({
                setNum: totalSetsNum,
                reps: item.reps,
                time: timeText
            });
        } else {
            database[todayStr].push({
                name: name,
                weightDisplay: weightText,
                sets: [{ setNum: 1, reps: item.reps, time: timeText }]
            });
        }

        localStorage.setItem('workout_db', JSON.stringify(database));
        
        // 💡 핵심: 상단 고정 전광판에 현재 몇 세트 완료했는지 즉각 연동 표시
        const liveCounterBox = document.getElementById('liveCounterBox');
        liveCounterBox.innerHTML = `📢 최근 완료: <span style="color:#fff;">${name} [${weightText}]</span> ➔ <span style="color:#4caf50; font-size:15px; text-decoration:underline;">${totalSetsNum}세트째</span> 폭격 완료! 🔥`;

        initCalendar();
        showHistoryAt(todayStr);
        startTimer(item.rest);
    }

    function showHistoryAt(dateStr) {
        document.getElementById('historyTitle').innerText = `📅 ${dateStr}의 전체 기록 피드`;
        const content = document.getElementById('historyContent');
        content.innerHTML = '';

        if (!database[dateStr] || database[dateStr].length === 0) {
            content.innerText = '이 날 기록된 운동이 없습니다. 바벨을 드십시오!';
            return;
        }

        database[dateStr].forEach((log, groupIdx) => {
            const row = document.createElement('div');
            row.className = 'log-entry';
            
            let setRowsHtml = '';
            log.sets.forEach((s, sIdx) => {
                setRowsHtml += `
                    <div class="set-row">
                        <span style="color:var(--text-muted); font-size:12px;">└ ${s.setNum}세트</span>
                        <span style="color:var(--accent-color); font-weight:bold;">${s.reps}회 <small style="color:#666;">(${s.time})</small></span>
                    </div>
                `;
            });

            row.innerHTML = `
                <div style="display:flex; justify-content:space-between; font-weight:bold; border-bottom:1px dashed #333; padding-bottom:3px;">
                    <span>${log.name}</span>
                    <span style="color:#ff9800;">[${log.weightDisplay}]</span>
                </div>
                ${setRowsHtml}
            `;
            
            row.onclick = () => {
                const choice = prompt(`[${log.name}] 기록 편집창\n\n1: 전체 세트 삭제\n2: 마지막 세트 횟수 수정\n원하는 작업 번호를 입력하십시오.`);
                
                if (choice === '1') {
                    if (confirm("이 종목의 기록을 통째로 지우시겠습니까?")) {
                        database[dateStr].splice(groupIdx, 1);
                        saveAndReloadHistory(dateStr);
                    }
                } else if (choice === '2') {
                    const lastSet = log.sets[log.sets.length - 1];
                    const newReps = prompt(`마지막 ${lastSet.setNum}세트의 수정할 횟수를 입력하십시오.`, lastSet.reps);
                    if (newReps !== null && !isNaN(newReps) && newReps.trim() !== "") {
                        lastSet.reps = parseInt(newReps);
                        saveAndReloadHistory(dateStr);
                    }
                }
            };

            content.appendChild(row);
        });
    }

    function saveAndReloadHistory(dateStr) {
        if (database[dateStr] && database[dateStr].length === 0) {
            delete database[dateStr];
        }
        localStorage.setItem('workout_db', JSON.stringify(database));
        initCalendar();
        showHistoryAt(dateStr);
    }

    function startTimer(seconds) {
        clearInterval(timerInterval);
        timerTimeLeft = seconds;
        const display = document.getElementById('timerDisplay');
        const status = document.getElementById('timerStatus');
        
        status.innerText = "🔥 근육 회복 중... 강해지는 시간! 🔥";
        status.style.color = "#ff9800";

        timerInterval = setInterval(() => {
            timerTimeLeft--;
            const mins = Math.floor(timerTimeLeft / 60).toString().padStart(2, '0');
            const secs = (timerTimeLeft % 60).toString().padStart(2, '0');
            display.innerText = `${mins}:${secs}`;

            if (timerTimeLeft <= 0) {
                clearInterval(timerInterval);
                display.innerText = "00:00";
                status.innerText = "💪 휴식 끝! 다음 세트 폭격하십시오! 💪";
                status.style.color = "#4caf50";
                if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
            }
        }, 1000);
    }
</script>
</body>
</html>
