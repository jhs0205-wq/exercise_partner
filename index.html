<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강철 오운완 시스템 v7.5</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #4caf50;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --danger-color: #e57373;
            --edit-color: #64b5f6;
            --info-color: #ff9800;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            margin: 0;
            font-size: 22px;
        }

        /* ⏱️ 상단 고정 통합 계기판 */
        .status-board {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
            position: sticky;
            top: 10px;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 2px 0;
            font-variant-numeric: tabular-nums;
        }

        .live-counter {
            background: #151515;
            padding: 6px;
            border-radius: 6px;
            margin-top: 5px;
            font-size: 13px;
            font-weight: bold;
            color: var(--info-color);
            border: 1px solid #333;
        }

        /* 🗂️ 루틴 탭 관리 */
        .routine-management {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #2d2d2d;
        }

        .routine-tabs {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .routine-tabs::-webkit-scrollbar { height: 4px; }
        .routine-tabs::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

        .tab-btn {
            background-color: #252525;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
        }

        .tab-btn.active { background-color: var(--accent-color); }

        .tab-controls { display: flex; gap: 5px; }
        .control-btn { flex: 1; padding: 6px; font-size: 12px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-add-tab { background-color: #2e7d32; }
        .btn-del-tab { background-color: #c62828; }

        /* 🚀 원 플레이어 작동 제어바 */
        .player-control-bar {
            background-color: #252525;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }

        .player-status-text {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .player-main-btn {
            background-color: #388e3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .player-main-btn.active { background-color: #d32f2f; }

        /* 🏋️‍♂️ 슬림 운동 카드 */
        .workout-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid #2d2d2d;
        }

        .workout-main-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .workout-title { font-size: 16px; font-weight: bold; color: #fff; }
        .workout-meta-summary { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .main-edit-trigger { background: #333; color: var(--edit-color); border: 1px solid #444; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }

        /* 🛠️ 수정 선택 시 노출 제어판 */
        .workout-expanded-panel {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #444;
            background: #181818;
            border-radius: 6px;
            padding: 10px;
        }

        .panel-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .panel-row:last-child { margin-bottom: 0; }
        .move-controls { display: flex; gap: 4px; }
        .panel-btn { background: #333; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .panel-btn-del { background-color: var(--danger-color); color: white; font-weight: bold; }
        .panel-rest-input { width: 50px; background: #121212; border: 1px solid #555; color: var(--accent-color); text-align: center; border-radius: 4px; font-weight: bold; padding: 2px; }

        /* 🔢 입력 조절 UI */
        .input-group { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; margin-bottom: 12px; }
        .control-label { width: 50px; font-weight: bold; color: var(--text-muted); }
        .counter-btn { background-color: #333; color: white; border: none; width: 40px; height: 40px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .value-display { font-size: 18px; font-weight: bold; width: 80px; text-align: center; }
        .bodyweight-display { font-size: 18px; font-weight: bold; width: 170px; text-align: center; color: var(--accent-color); background: #151515; padding: 8px 0; border-radius: 8px; }

        .log-btn { width: 100%; background-color: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }

        /* ➕ 운동 추가 카드 */
        .add-workout-card { background-color: #252525; border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px dashed var(--accent-color); }
        .add-input { width: 100%; padding: 10px; margin-bottom: 10px; background: #121212; border: 1px solid #444; color: white; border-radius: 6px; box-sizing: border-box; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; color: var(--text-muted); }
        .add-btn { width: 100%; background-color: var(--accent-color); color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* 📅 하단 구조물 */
        .calendar-card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; margin-top: 30px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .calendar-day-label { font-size: 12px; color: var(--text-muted); font-weight: bold; padding-bottom: 5px; }
        .calendar-day { background: #252525; padding: 8px 0; border-radius: 6px; font-size: 14px; cursor: pointer; border: 1px solid transparent; position: relative; }
        .calendar-day.selected { border: 1px solid var(--accent-color); background: #1b3a1b; }
        .calendar-day.has-log::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; background-color: var(--accent-color); border-radius: 50%; }

        .history-section { background-color: #1a1a1a; border-radius: 12px; padding: 15px; margin-bottom: 40px; border: 1px solid #333; }
        .log-entry { display: flex; flex-direction: column; padding: 10px; border-bottom: 1px solid #252525; font-size: 14px; border-radius: 6px; margin-bottom: 8px; background: #222; gap: 4px; }
        .set-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13px; border-top: 1px solid #2d2d2d; }
        .inline-btn { padding: 2px 6px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; margin-left: 4px; color: white; }
        .btn-edit { background-color: var(--edit-color); }
        .btn-del { background-color: var(--danger-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ 강철 오운완 시스템 v7.5</h1>
        <p style="color: var(--text-muted); margin: 5px 0 0 0;">실시간 원 플레이어 집중 모드</p>
    </header>

    <div class="status-board">
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div style="color: var(--accent-color); font-size: 12px; font-weight: bold; margin-bottom: 3px;" id="timerStatus">대기 중</div>
        <div class="live-counter" id="liveCounterBox">현재 진행 중인 세트가 없습니다.</div>
    </div>

    <div class="routine-management">
        <div class="routine-tabs" id="routineTabsContainer"></div>
        <div class="tab-controls">
            <button class="control-btn btn-add-tab" onclick="addCustomRoutine()">➕ 새 루틴 추가</button>
            <button class="control-btn btn-del-tab" onclick="deleteCurrentRoutine()">🗑️ 현재 루틴 삭제</button>
        </div>
    </div>

    <div class="player-control-bar">
        <div class="player-status-text" id="playerStatusText">모드: 전체 목록 보기 상태</div>
        <button class="player-main-btn" id="playerMainBtn" onclick="togglePlayerMode()">▶️ 운동 시작</button>
    </div>

    <div id="workoutContainer"></div>

    <div class="add-workout-card">
        <div style="font-weight: bold; margin-bottom: 10px; color: var(--accent-color);" id="addTitle">현재 탭에 운동 추가</div>
        <input type="text" id="newWorkoutName" class="add-input" placeholder="예: 벤치프레스, 턱걸이, 크런치">
        <input type="number" id="newWorkoutRest" class="add-input" placeholder="휴식 시간 (초 단위, 예: 60, 120)" value="60">
        <div class="checkbox-group">
            <input type="checkbox" id="isBodyweight">
            <label for="isBodyweight">⚠️ 무게 없는 맨몸 운동 (턱걸이, 크런치 등)</label>
        </div>
        <button class="add-btn" onclick="addNewWorkout()">선택된 루틴에 추가</button>
    </div>

    <div class="calendar-card">
        <div class="calendar-header">
            <span id="calendarMonthYear"></span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <div class="history-section">
        <div style="font-weight: bold; color: var(--accent-color); margin-bottom: 10px;" id="historyTitle">오늘의 기록</div>
        <div id="historyContent" style="color: var(--text-muted); font-size: 14px;">선택한 날짜에 기록된 운동이 없습니다.</div>
    </div>
</div>

<script>
    let timerInterval = null;
    let timerTimeLeft = 0;
    
    let database = JSON.parse(localStorage.getItem('workout_db')) || {};
    
    // 🗂️ 요구사항 반영: 1, 2, 3 순번 지정 및 부위별 배치 완료
    const defaultRoutine = {
        "1.가슴": [
            { id: 'p1', name: '벤치프레스', weight: 60, reps: 7, rest: 180, weightUnit: 5, isBodyweight: false },
            { id: 'p2', name: '인클 덤벨프레스', weight: 15, reps: 15, rest: 120, weightUnit: 1, isBodyweight: false },
            { id: 'p3', name: '인클 펙덱', weight: 8, reps: 15, rest: 60, weightUnit: 1, isBodyweight: false }
        ],
        "2.등": [
            { id: 'l1', name: '데드', weight: 120, reps: 5, rest: 240, weightUnit: 5, isBodyweight: false },
            { id: 'l2', name: '바벨로우', weight: 50, reps: 8, rest: 120, weightUnit: 5, isBodyweight: false },
            { id: 'l3', name: '턱걸이', weight: 0, reps: 5, rest: 120, weightUnit: 1, isBodyweight: true }
        ],
        "3.하체_어깨": [
            { id: 'g1', name: '스쿼트', weight: 90, reps: 5, rest: 240, weightUnit: 5, isBodyweight: false },
            { id: 'g2', name: '런지', weight: 0, reps: 12, rest: 90, weightUnit: 1, isBodyweight: false },
            { id: 'g3', name: 'ohp', weight: 40, reps: 6, rest: 120, weightUnit: 5, isBodyweight: false },
            { id: 'g4', name: '사레레', weight: 4, reps: 20, rest: 60, weightUnit: 1, isBodyweight: false },
            { id: 'g5', name: '레그레이즈', weight: 0, reps: 15, rest: 60, weightUnit: 1, isBodyweight: true }
        ]
    };
    
    let routineData = JSON.parse(localStorage.getItem('routine_db_v75')) || defaultRoutine;
    let currentRoutine = Object.keys(routineData)[0] || "1.가슴";

    // 🚀 원 플레이어 모드 제어 상태 변수
    let isPlayerRunning = false;
    let playerCurrentIndex = 0;

    const todayStr = getFormattedDate(new Date());
    let selectedDateStr = todayStr;

    initCalendar();
    renderTabs();
    renderWorkouts();
    showHistoryAt(todayStr);

    function getFormattedDate(date) {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    // 🚀 원 플레이어 집중 모드 스위칭 함수
    function togglePlayerMode() {
        const list = routineData[currentRoutine] || [];
        if(list.length === 0) {
            alert("수행할 운동 종목이 루틴에 없습니다!");
            return;
        }

        const mainBtn = document.getElementById('playerMainBtn');
        const statusText = document.getElementById('playerStatusText');

        if(!isPlayerRunning) {
            // 집중 모드 시작
            isPlayerRunning = true;
            playerCurrentIndex = 0;
            mainBtn.innerText = "⏹️ 운동 종료";
            mainBtn.classList.add('active');
        } else {
            // 집중 모드 해제
            isPlayerRunning = false;
            mainBtn.innerText = "▶️ 운동 시작";
            mainBtn.classList.remove('active');
            statusText.innerText = "모드: 전체 목록 보기 상태";
        }
        renderWorkouts();
    }

    function renderTabs() {
        const container = document.getElementById('routineTabsContainer');
        container.innerHTML = '';
        
        const keys = Object.keys(routineData);
        if(keys.length === 0) {
            container.innerHTML = `<div style="font-size:12px; color:var(--text-muted);">루틴이 없습니다. 추가하십시오.</div>`;
            return;
        }

        if(!keys.includes(currentRoutine)) {
            currentRoutine = keys[0];
        }

        keys.forEach(key => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${key === currentRoutine ? 'active' : ''}`;
            btn.innerText = key;
            btn.onclick = () => {
                if(isPlayerRunning) {
                    if(!confirm("현재 분할 운동 진행 중입니다. 다른 루틴으로 이동 시 진행 상태가 초기화됩니다. 이동하시겠습니까?")) return;
                    isPlayerRunning = false;
                    const mainBtn = document.getElementById('playerMainBtn');
                    mainBtn.innerText = "▶️ 운동 시작";
                    mainBtn.classList.remove('active');
                }
                currentRoutine = key;
                renderTabs();
                renderWorkouts();
            };
            container.appendChild(btn);
        });
        document.getElementById('addTitle').innerText = `＋ [${currentRoutine}] 루틴에 운동 추가`;
    }

    function addCustomRoutine() {
        const newName = prompt("새로 추가할 루틴 이름을 입력하십시오. (예: 4.어깨, 5.팔)");
        if(!newName || !newName.trim()) return;
        
        const cleanName = newName.trim();
        if(routineData[cleanName]) {
            alert("이미 있는 이름입니다.");
            return;
        }

        routineData[cleanName] = [];
        currentRoutine = cleanName;
        saveRoutineDB();
        renderTabs();
        renderWorkouts();
    }

    function deleteCurrentRoutine() {
        if(!confirm(`[${currentRoutine}] 루틴을 통째로 제거하겠습니까?`)) return;
        
        delete routineData[currentRoutine];
        const keys = Object.keys(routineData);
        currentRoutine = keys.length > 0 ? keys[0] : "";
        
        saveRoutineDB();
        renderTabs();
        renderWorkouts();
    }

    function saveRoutineDB() {
        localStorage.setItem('routine_db_v75', JSON.stringify(routineData));
    }

    function addNewWorkout() {
        if(!currentRoutine) {
            alert("루틴 탭을 먼저 만들어 주십시오!");
            return;
        }
        const nameInput = document.getElementById('newWorkoutName');
        const restInput = document.getElementById('newWorkoutRest');
        const isBodyweightCheck = document.getElementById('isBodyweight');
        
        if (!nameInput.value.trim()) {
            alert('운동 명칭을 입력하십시오!');
            return;
        }

        const name = nameInput.value.trim();
        const isHeavy = name.includes('벤치') || name.includes('스쿼트') || name.includes('데드') || name.includes('로우') || name.includes('프레스') || name.includes('ohp');
        const newId = 'custom_' + Date.now();
        
        routineData[currentRoutine].push({
            id: newId,
            name: name,
            weight: isBodyweightCheck.checked ? 0 : (isHeavy ? 40 : 10),
            reps: 10,
            rest: parseInt(restInput.value) || 60,
            weightUnit: isHeavy ? 5 : 1,
            isBodyweight: isBodyweightCheck.checked
        });

        saveRoutineDB();
        nameInput.value = '';
        isBodyweightCheck.checked = false;
        renderWorkouts();
    }

    // 🏋️‍♂️ 원 플레이어 조건 분기식 주입 렌더러
    function renderWorkouts() {
        const container = document.getElementById('workoutContainer');
        container.innerHTML = '';

        const fullList = routineData[currentRoutine] || [];

        if(fullList.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted); font-size:14px;">루틴이 비어있습니다. 아래에서 추가하십시오.</div>`;
            return;
        }

        // 집중 타겟 배열 타겟팅
        let renderTargetList = [];
        if(isPlayerRunning) {
            // 집중 모드인 경우: 현재 인덱스의 단 한 종목만 추출
            if(playerCurrentIndex >= fullList.length) {
                // 루틴 전체 폭격 완수 시 처리
                document.getElementById('playerStatusText').innerText = "🎉 축하합니다! 오늘의 루틴을 전부 완료하셨습니다!";
                isPlayerRunning = false;
                const mainBtn = document.getElementById('playerMainBtn');
                mainBtn.innerText = "▶️ 운동 시작";
                mainBtn.classList.remove('active');
                renderWorkouts();
                return;
            }
            renderTargetList = [fullList[playerCurrentIndex]];
            document.getElementById('playerStatusText').innerText = `🎯 진행 중: [${playerCurrentIndex + 1} / ${fullList.length}] 번째 운동 폭격 중`;
        } else {
            // 일반 모드: 전체 목록 표출
            renderTargetList = fullList;
        }

        renderTargetList.forEach((w, displayIdx) => {
            const card = document.createElement('div');
            card.className = 'workout-card';

            let completedSets = 0;
            if(database[todayStr]) {
                const logged = database[todayStr].filter(log => log.name === w.name);
                logged.forEach(l => completedSets += l.sets.length);
            }

            let weightSection = '';
            if (w.isBodyweight) {
                weightSection = `
                    <div class="input-group">
                        <div class="control-label">무게</div>
                        <div class="bodyweight-display">💪 맨몸 운동</div>
                    </div>
                `;
            } else {
                weightSection = `
                    <div class="input-group">
                        <div class="control-label">무게</div>
                        <button class="counter-btn" onclick="adjustValue('${w.id}', 'weight', -${w.weightUnit})">-${w.weightUnit}</button>
                        <div class="value-display" id="${w.id}-weight">${w.weight} kg</div>
                        <button class="counter-btn" onclick="adjustValue('${w.id}', 'weight', ${w.weightUnit})">+${w.weightUnit}</button>
                    </div>
                `;
            }

            // 집중 플레이어 모드 유무에 따른 완료 버튼 레이블 유동 변경
            const primaryBtnText = isPlayerRunning ? "✔️ 이번 세트 완료 (다음 운동 패스 가능)" : "세트 완료";

            card.innerHTML = `
                <div class="workout-main-info">
                    <div>
                        <div class="workout-title">${w.name}</div>
                        <div class="workout-meta-summary">
                            ⏱️ 휴식시간: ${w.rest}초 | 📊 총 완료 세트 수: <span style="color:var(--accent-color); font-weight:bold;">${completedSets}세트</span>
                        </div>
                    </div>
                    <button class="main-edit-trigger" onclick="toggleEditPanel('${w.id}')">⚙️ 수정</button>
                </div>

                <div class="workout-expanded-panel" id="panel-${w.id}">
                    <div class="panel-row">
                        <span>순서 변경</span>
                        <div class="move-controls">
                            <button class="panel-btn" onclick="moveWorkout('${w.id}', -1)">▲ 위로</button>
                            <button class="panel-btn" onclick="moveWorkout('${w.id}', 1)">▼ 아래로</button>
                        </div>
                    </div>
                    <div class="panel-row">
                        <span>휴식시간 편집</span>
                        <div>
                            <input type="number" class="panel-rest-input" value="${w.rest}" onchange="updateRestTime('${w.id}', this.value)"> 초
                        </div>
                    </div>
                    <div class="panel-row" style="justify-content: flex-end;">
                        <button class="panel-btn panel-btn-del" onclick="deleteWorkout('${w.id}')">🗑️ 이 종목 제거</button>
                    </div>
                </div>
                
                ${weightSection}

                <div class="input-group">
                    <div class="control-label">횟수</div>
                    <button class="counter-btn" onclick="adjustValue('${w.id}', 'reps', -1)">-1</button>
                    <div class="value-display" id="${w.id}-reps">${w.reps} 회</div>
                    <button class="counter-btn" onclick="adjustValue('${w.id}', 'reps', 1)">+1</button>
                </div>

                <button class="log-btn" onclick="logSet('${w.id}', '${w.name}')">${primaryBtnText}</button>
                
                ${isPlayerRunning ? `<button class="log-btn" style="background-color:#1565c0; margin-top:8px;" onclick="nextPlayerStep()">➡️ 종목 종료 (다음 운동으로 넘어가기)</button>` : ''}
            `;
            container.appendChild(card);
        });
    }

    // 🚀 원 플레이어 다음 인덱스 강제 이동 트리거
    function nextPlayerStep() {
        playerCurrentIndex++;
        renderWorkouts();
    }

    function toggleEditPanel(id) {
        const panel = document.getElementById(`panel-${id}`);
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function updateRestTime(id, newSeconds) {
        const fullList = routineData[currentRoutine] || [];
        const item = fullList.find(w => w.id === id);
        if(item) item.rest = parseInt(newSeconds) || 0;
        saveRoutineDB();
        renderWorkouts();
    }

    function moveWorkout(id, direction) {
        const fullList = routineData[currentRoutine] || [];
        const index = fullList.findIndex(w => w.id === id);
        if (index === -1) return;
        
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= fullList.length) return;
        
        const temp = fullList[index];
        fullList[index] = fullList[newIndex];
        fullList[newIndex] = temp;
        
        saveRoutineDB();
        renderWorkouts();
        const p = document.getElementById(`panel-${id}`);
        if(p) p.style.display = 'block';
    }

    function deleteWorkout(id) {
        if(!confirm("이 운동을 루틴에서 제외하겠습니까?")) return;
        routineData[currentRoutine] = (routineData[currentRoutine] || []).filter(w => w.id !== id);
        saveRoutineDB();
        if(isPlayerRunning) isPlayerRunning = false; // 꼬임 방지 단일화 초기화
        renderWorkouts();
    }

    function adjustValue(id, key, amount) {
        const fullList = routineData[currentRoutine] || [];
        const item = fullList.find(w => w.id === id);
        if(item) {
            item[key] += amount;
            if(item[key] < 0) item[key] = 0;
            const el = document.getElementById(`${id}-${key}`);
            if(el) el.innerText = item[key] + (key === 'weight' ? ' kg' : ' 회');
            saveRoutineDB();
        }
    }

    function logSet(id, name) {
        if (selectedDateStr !== todayStr) {
            alert("🔒 운동 기록은 당일(오늘 날짜)만 가능합니다!");
            return;
        }

        const fullList = routineData[currentRoutine] || [];
        const item = fullList.find(w => w.id === id);
        
        if (!database[todayStr]) database[todayStr] = [];

        const weightText = item.isBodyweight ? '맨몸' : `${item.weight}kg`;
        const timeText = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

        const existingGroup = database[todayStr].find(log => log.name === name && log.weightDisplay === weightText);
        let totalSetsNum = 1;

        if (existingGroup) {
            totalSetsNum = existingGroup.sets.length + 1;
            existingGroup.sets.push({ setNum: totalSetsNum, reps: item.reps, time: timeText });
        } else {
            database[todayStr].push({ name: name, weightDisplay: weightText, sets: [{ setNum: 1, reps: item.reps, time: timeText }] });
        }

        localStorage.setItem('workout_db', JSON.stringify(database));
        
        const liveCounterBox = document.getElementById('liveCounterBox');
        liveCounterBox.innerHTML = `📢 최근 완료: <span style="color:#fff;">${name} [${weightText}]</span> ➔ <span style="color:#4caf50; font-size:15px; text-decoration:underline;">${totalSetsNum}세트째</span> 완료! 🔥`;

        initCalendar();
        renderWorkouts();
        showHistoryAt(todayStr);
        startTimer(item.rest);
    }

    function showHistoryAt(dateStr) {
        document.getElementById('historyTitle').innerText = `📅 ${dateStr}의 전체 기록 피드`;
        const content = document.getElementById('historyContent');
        content.innerHTML = '';

        if (!database[dateStr] || database[dateStr].length === 0) {
            content.innerText = '이 날 기록된 운동이 없습니다.';
            return;
        }

        database[dateStr].forEach((log, groupIdx) => {
            const row = document.createElement('div');
            row.className = 'log-entry';
            
            let setRowsHtml = '';
            log.sets.forEach((s, sIdx) => {
                setRowsHtml += `
                    <div class="set-row">
                        <span style="color:var(--text-muted); font-size:12px;">└ ${s.setNum}세트: ${s.reps}회 <small style="color:#555;">(${s.time})</small></span>
                        <div>
                            <button class="inline-btn btn-edit" onclick="editSpecificSet('${dateStr}', ${groupIdx}, ${sIdx})">✏️ 수정</button>
                            <button class="inline-btn btn-del" onclick="deleteSpecificSet('${dateStr}', ${groupIdx}, ${sIdx})">🗑️ 삭제</button>
                        </div>
                    </div>
                `;
            });

            row.innerHTML = `
                <div style="display:flex; justify-content:space-between; font-weight:bold; padding: 6px; background:#2a2a2a; border-radius:4px 4px 0 0;">
                    <span>${log.name}</span>
                    <span style="color:#ff9800;">[${log.weightDisplay}]</span>
                </div>
                <div style="padding: 6px;">${setRowsHtml}</div>
            `;
            content.appendChild(row);
        });
    }

    function editSpecificSet(dateStr, groupIdx, sIdx) {
        const log = database[dateStr][groupIdx];
        const targetSet = log.sets[sIdx];
        const newReps = prompt(`[${log.name}] ${targetSet.setNum}세트의 수정할 횟수를 입력하십시오.`, targetSet.reps);
        if (newReps !== null && !isNaN(newReps) && newReps.trim() !== "") {
            targetSet.reps = parseInt(newReps);
            saveAndReloadHistory(dateStr);
        }
    }

    function deleteSpecificSet(dateStr, groupIdx, sIdx) {
        if (!confirm("이 세트 기록을 완전히 삭제하시겠습니까?")) return;
        const log = database[dateStr][groupIdx];
        log.sets.splice(sIdx, 1);

        if (log.sets.length === 0) {
            database[dateStr].splice(groupIdx, 1);
        } else {
            log.sets.forEach((s, index) => { s.setNum = index + 1; });
        }
        saveAndReloadHistory(dateStr);
        renderWorkouts();
    }

    function saveAndReloadHistory(dateStr) {
        if (database[dateStr] && database[dateStr].length === 0) delete database[dateStr];
        localStorage.setItem('workout_db', JSON.stringify(database));
        initCalendar();
        showHistoryAt(dateStr);
    }

    function initCalendar() {
        const now = new Date();
        document.getElementById('calendarMonthYear').innerText = `${now.getFullYear()}년 ${now.getMonth() + 1}월`;
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const days = ['일', '월', '화', '수', '목', '금', '토'];
        days.forEach(d => {
            const label = document.createElement('div');
            label.className = 'calendar-day-label';
            label.innerText = d;
            grid.appendChild(label);
        });

        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0);
        
        for(let i=0; i<startOfMonth.getDay(); i++) grid.appendChild(document.createElement('div'));

        for(let d=1; d<=endOfMonth.getDate(); d++) {
            const dayBox = document.createElement('div');
            dayBox.className = 'calendar-day';
            dayBox.innerText = d;
            
            const targetDateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            if (database[targetDateStr] && database[targetDateStr].length > 0) dayBox.classList.add('has-log');
            if (targetDateStr === selectedDateStr) dayBox.classList.add('selected');

            dayBox.onclick = () => {
                document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected'));
                dayBox.classList.add('selected');
                selectedDateStr = targetDateStr;
                showHistoryAt(targetDateStr);
            };
            grid.appendChild(dayBox);
        }
    }

    function startTimer(seconds) {
        clearInterval(timerInterval);
        timerTimeLeft = seconds;
        const display = document.getElementById('timerDisplay');
        const status = document.getElementById('timerStatus');
        status.innerText = "🔥 근육 회복 중... 강해지는 시간! 🔥";
        status.style.color = "#ff9800";

        timerInterval = setInterval(() => {
            timerTimeLeft--;
            const mins = Math.floor(timerTimeLeft / 60).toString().padStart(2, '0');
            const secs = (timerTimeLeft % 60).toString().padStart(2, '0');
            display.innerText = `${mins}:${secs}`;

            if (timerTimeLeft <= 0) {
                clearInterval(timerInterval);
                display.innerText = "00:00";
                status.innerText = "💪 휴식 끝! 다음 세트 폭격하십시오! 💪";
                status.style.color = "#4caf50";
                if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
            }
        }, 1000);
    }
</script>
</body>
</html>
